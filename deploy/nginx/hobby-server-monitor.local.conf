# Hobby Server Monitor
# Local deployment verification only.
#
# Accessible on 127.0.0.1:8080.
# Not suitable for remote authentication.

server {
    listen 127.0.0.1:8080;

    server_name localhost;

    root /srv/hobby-server-monitor/www;
    index index.html;

    server_tokens off;
    access_log off;

    client_max_body_size 128k;

    # Falcon API

    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 60s;
    }

    # Google OAuth and logout

    location /auth/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # Compiled Astro pages and static assets

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
}
