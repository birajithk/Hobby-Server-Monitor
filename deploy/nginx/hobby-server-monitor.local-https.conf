# Hobby Server Monitor
# Local HTTPS integration testing.
#
# Address:
# https://localhost:8443
#
# Certificate issued by a locally trusted
# development CA using mkcert.
#
# This configuration is loopback-only.
# Do not use it for public network deployment.

server {
    listen 127.0.0.1:8443 ssl;

    server_name localhost;

    ssl_certificate
        /etc/hobby-server-monitor/tls/localhost.pem;

    ssl_certificate_key
        /etc/hobby-server-monitor/tls/localhost-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/hobby-server-monitor/www;
    index index.html;

    server_tokens off;
    access_log off;

    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Falcon API.

    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_read_timeout 60s;
    }

    # Google OAuth login, callback and logout.

    location /auth/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 60s;
    }

    # Compiled Astro static application.

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
}
