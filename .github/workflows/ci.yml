name: Hobby Server Monitor CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/deployment-foundation]
  workflow_dispatch:

# No write access to the repository and no application credentials in CI.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Falcon backend / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Install targeted lint checker
        run: python -m pip install 'ruff>=0.8,<1.0'

      - name: Critical Python lint checks
        # Critical syntax, malformed imports, undefined symbols and flow errors.
        # Broader style rules can be adopted after baseline violations are resolved.
        run: ruff check app tests --select E4,E7,E9,F63,F7,F82

      - name: Run backend unit and security tests
        # Existing tests mock LXD and use temporary SQLite/TinyFlux files.
        # The app's mocked test credentials are not live OAuth credentials.
        run: python -m unittest discover -s tests -v

  frontend-build:
    name: Astro frontend / Node 22
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build static Astro site
        run: npm run build

  repo-checks:
    name: Static repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check for whitespace errors
        run: git diff --check HEAD^
        if: github.event_name == 'push' && github.event.created == false

      - name: Check shell script syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in deploy/scripts/*.sh; do bash -n "$script"; done

      - name: Verify expected configuration templates
        shell: bash
        run: |
          set -euo pipefail
          test -f .env.example
          test -f deploy/hsm.env.example
          test -f backend/requirements.txt
          test -f dashboard/package-lock.json
          test -f deploy/systemd/hobby-server-monitor-api.service
          test -f deploy/systemd/hobby-server-monitor-collector.service
          if git ls-files -- .env backend/.env | grep -q .; then
            echo 'ERROR: An actual environment file is tracked.' >&2
            exit 1
          fi
          echo 'Repository structure checks passed.'
